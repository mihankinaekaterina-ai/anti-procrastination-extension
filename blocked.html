<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пора сделать небольшое дело</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <main class="page-card">
    <div class="clock">⏳</div>
    <p class="overline">ТАЙМЕР ПРОКРАСТИНАЦИИ</p>
    <h1>Сначала маленькое дело</h1>
    <p class="intro">Сайт пока на паузе. Выполните короткое задание — и получите время для отдыха.</p>

    <section class="task-box">
      <span id="taskType" class="task-type">ВАШЕ ЗАДАНИЕ</span>
      <h2 id="taskTitle">Загружаем задание...</h2>
      <p id="taskDescription" class="task-description"></p>
      <div id="taskContent"></div>
      <p id="feedback" class="feedback" aria-live="polite"></p>
      <button id="completeTask" class="primary-button" disabled>Я выполнил(а) задание</button>
    </section>

    <p class="reward-note">После выполнения откроется доступ к сайтам отдыха на выбранное вами время.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
